name: pihole
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: pihole/pihole:latest
    container_name: pihole-app
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      DNSSEC: true
      TAIL_FTL_LOG: 1
      TEMPERATUREUNIT: f
      WEBTHEME: default-dark
      WEBUIBOXEDLAYOUT: boxed
      TZ: ${TZ:-America/New_York}
      FTLCONF_dns_listeningMode: all
      FTLCONF_misc_etc_dnsmasq_d: true
      PIHOLE_DOMAIN: ${BASE_HOST_NAME:-$HOSTNAME}
      FTLCONF_webserver_api_password: ${APP_ADMIN_PASS:-changeme_admin_password}
      FTLCONF_dns_upstreams: 103.124.104.139;82.29.128.43;1.1.1.1;8.8.8.8
      CONTAINER_NAME: pihole-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
    volumes:
      - './volumes/config/pihole:/etc/pihole'
      - './volumes/config/dnsmasq:/etc/dnsmasq.d'
    cap_add:
      - SYS_TIME
      - SYS_NICE
      - NET_ADMIN
    ports:
      - '53:53/tcp'
      - '53:53/udp'
    labels:
      - 'cloudflare.enable=true'
      - 'cloudflare.service=http://pihole-app:80'
      - 'cloudflare.hostname=${BASE_HOST_NAME:-$HOSTNAME}'
    networks:
      - pihole
      - cloudflare

networks:
  pihole:
    name: pihole
    external: false
  cloudflare:
    external: true
